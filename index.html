<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF 阅读与标注工具</title>
  <link rel="stylesheet" href="/src/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <div class="top-left">
        <button id="btn-open" title="打开文件 (Ctrl+O)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h2.764c.958 0 1.76.56 2.311 1.184C7.985 3.648 8.48 4 9 4h4.5A1.5 1.5 0 0 1 15 5.5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5v-9zM2.5 3a.5.5 0 0 0-.5.5V6h12v-.5a.5.5 0 0 0-.5-.5H9c-.964 0-1.71-.629-2.174-1.154C6.374 3.334 5.82 3 5.264 3H2.5z"/></svg>
          <span>打开</span>
        </button>
        <button id="btn-add-blank" title="新增空白页">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2z"/></svg>
          <span>空白页</span>
        </button>
        <button id="btn-insert-image" title="插入图片">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zM2.002 12a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-2zm4.5-6.5a.5.5 0 1 0-1 0 .5.5 0 0 0 1 0z"/><path d="M1.5 2A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-13zm13 1a.5.5 0 0 1 .5.5v6l-3.775-1.947a.5.5 0 0 0-.577.063L7.68 9.738 5.378 8.22a.5.5 0 0 0-.49-.023L1 10.1V3.5a.5.5 0 0 1 .5-.5h13z"/></svg>
          <span>插图</span>
        </button>
        <span class="divider"></span>
        <button id="btn-export-pdf" title="导出 PDF（含标注）">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/></svg>
          <span>导出PDF</span>
        </button>
        <button id="btn-export-xfdf" title="导出 XFDF（仅标注）">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5zM9.5 3V1.5L13 5h-1.5A2 2 0 0 1 9.5 3z"/></svg>
          <span>导出XFDF</span>
        </button>
      </div>
      <div class="top-center">
        <span id="file-name" class="file-name">未打开文件</span>
      </div>
      <div class="top-right">
        <button id="btn-search" title="搜索 (Ctrl+F)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85zm-5.242.156a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
        </button>
        <button id="btn-dark" title="深色模式">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zM8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zm0 2.5v11a5.5 5.5 0 1 0 0-11z"/></svg>
        </button>
        <button id="btn-undo" title="撤销 (Ctrl+Z)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.418A6 6 0 1 0 8 2v1z"/><path d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466z"/></svg>
        </button>
      </div>
    </header>

    <div id="search-bar" class="hidden">
      <input type="text" id="search-input" placeholder="搜索 PDF 全文..." />
      <span id="search-count">0/0</span>
      <button id="search-prev" title="上一个">&#9650;</button>
      <button id="search-next" title="下一个">&#9660;</button>
      <button id="search-close" title="关闭">✕</button>
    </div>

    <div id="main-area">
      <aside id="sidebar-left">
        <div class="sidebar-header">已打开文件</div>
        <div id="file-list"></div>
        <div class="sidebar-header">页面缩略图</div>
        <div id="thumbnail-list"></div>
      </aside>

      <section id="viewer-container">
        <div id="annotation-toolbar" class="hidden">
          <div class="tool-group">
            <button class="tool-btn" data-tool="highlight" title="高亮">
              <svg width="18" height="18" viewBox="0 0 18 18"><rect x="2" y="7" width="14" height="6" rx="1" fill="#FFE066" stroke="#333" stroke-width="1"/></svg>
            </button>
            <button class="tool-btn" data-tool="underline" title="下划线">
              <svg width="18" height="18" viewBox="0 0 18 18"><line x1="3" y1="8" x2="15" y2="8" stroke="#333" stroke-width="2"/><line x1="3" y1="14" x2="15" y2="14" stroke="#4CAF50" stroke-width="2"/></svg>
            </button>
            <button class="tool-btn" data-tool="strikethrough" title="删除线">
              <svg width="18" height="18" viewBox="0 0 18 18"><line x1="3" y1="9" x2="15" y2="9" stroke="#F44336" stroke-width="2"/><line x1="3" y1="14" x2="15" y2="14" stroke="#F44336" stroke-width="2"/></svg>
            </button>
            <div class="color-picker" id="text-anno-color">
              <span class="color-dot active" data-color="#FFE066" style="background:#FFE066"></span>
              <span class="color-dot" data-color="#4CAF50" style="background:#4CAF50"></span>
              <span class="color-dot" data-color="#2196F3" style="background:#2196F3"></span>
              <span class="color-dot" data-color="#F44336" style="background:#F44336"></span>
            </div>
          </div>
          <span class="divider-v"></span>
          <div class="tool-group">
            <button class="tool-btn" data-tool="sticky" title="便签注释">
              <svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 2l2 4h4l-3 3 1 4-4-2-4 2 1-4-3-3h4z" fill="#FFC107" stroke="#333" stroke-width="0.5"/></svg>
            </button>
            <button class="tool-btn" data-tool="pen" title="手绘画笔">
              <svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 15l1-4L13 2l3 3L7 14z" fill="none" stroke="#333" stroke-width="1.5"/><path d="M3 15l1-4" stroke="#333" stroke-width="1"/></svg>
            </button>
            <div class="pen-options" id="pen-options" style="display:none">
              <div class="color-picker">
                <span class="color-dot active" data-color="#000000" style="background:#000000"></span>
                <span class="color-dot" data-color="#F44336" style="background:#F44336"></span>
                <span class="color-dot" data-color="#2196F3" style="background:#2196F3"></span>
                <span class="color-dot" data-color="#4CAF50" style="background:#4CAF50"></span>
              </div>
              <select id="pen-width" title="画笔粗细">
                <option value="1">细</option>
                <option value="2" selected>中</option>
                <option value="4">粗</option>
                <option value="6">特粗</option>
              </select>
            </div>
          </div>
          <span class="divider-v"></span>
          <div class="tool-group">
            <button class="tool-btn" data-tool="rect" title="矩形">
              <svg width="18" height="18" viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="12" fill="none" stroke="#333" stroke-width="1.5"/></svg>
            </button>
            <button class="tool-btn" data-tool="ellipse" title="椭圆">
              <svg width="18" height="18" viewBox="0 0 18 18"><ellipse cx="9" cy="9" rx="7" ry="5" fill="none" stroke="#333" stroke-width="1.5"/></svg>
            </button>
            <button class="tool-btn" data-tool="arrow" title="箭头">
              <svg width="18" height="18" viewBox="0 0 18 18"><line x1="3" y1="15" x2="14" y2="3" stroke="#333" stroke-width="1.5"/><polyline points="9,3 14,3 14,8" fill="none" stroke="#333" stroke-width="1.5"/></svg>
            </button>
            <button class="tool-btn" data-tool="line" title="直线">
              <svg width="18" height="18" viewBox="0 0 18 18"><line x1="2" y1="16" x2="16" y2="2" stroke="#333" stroke-width="1.5"/></svg>
            </button>
            <div class="shape-options" id="shape-options" style="display:none">
              <div class="color-picker">
                <span class="color-dot active" data-color="#000000" style="background:#000000"></span>
                <span class="color-dot" data-color="#F44336" style="background:#F44336"></span>
                <span class="color-dot" data-color="#2196F3" style="background:#2196F3"></span>
                <span class="color-dot" data-color="#4CAF50" style="background:#4CAF50"></span>
              </div>
              <select id="shape-width" title="形状线宽">
                <option value="1">1px</option>
                <option value="2" selected>2px</option>
                <option value="3">3px</option>
              </select>
            </div>
          </div>
          <span class="divider-v"></span>
          <div class="tool-group">
            <button class="tool-btn" data-tool="stamp" title="图章">
              <svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="10" width="12" height="5" rx="1" fill="#E91E63" stroke="#333" stroke-width="0.5"/><rect x="5" y="4" width="8" height="6" rx="1" fill="#E91E63" stroke="#333" stroke-width="0.5"/></svg>
            </button>
            <div class="stamp-panel" id="stamp-panel" style="display:none">
              <button class="stamp-preset" data-stamp="已审阅">已审阅</button>
              <button class="stamp-preset" data-stamp="草稿">草稿</button>
              <button class="stamp-preset" data-stamp="机密">机密</button>
              <button class="stamp-preset" data-stamp="批准">批准</button>
              <label class="stamp-upload">
                上传图片
                <input type="file" id="stamp-image-input" accept="image/*" style="display:none" />
              </label>
            </div>
          </div>
          <span class="divider-v"></span>
          <div class="tool-group">
            <button class="tool-btn" data-tool="textbox" title="文字框">
              <svg width="18" height="18" viewBox="0 0 18 18"><text x="3" y="14" font-size="14" font-weight="bold" fill="#333">T</text></svg>
            </button>
            <div class="textbox-options" id="textbox-options" style="display:none">
              <div class="color-picker">
                <span class="color-dot active" data-color="#000000" style="background:#000000"></span>
                <span class="color-dot" data-color="#F44336" style="background:#F44336"></span>
                <span class="color-dot" data-color="#2196F3" style="background:#2196F3"></span>
                <span class="color-dot" data-color="#4CAF50" style="background:#4CAF50"></span>
              </div>
              <select id="textbox-fontsize" title="字号">
                <option value="12">12</option>
                <option value="14" selected>14</option>
                <option value="16">16</option>
                <option value="18">18</option>
                <option value="24">24</option>
                <option value="32">32</option>
              </select>
            </div>
          </div>
        </div>

        <div id="pdf-viewport">
          <div id="pages-container"></div>
          <div id="drop-overlay" class="hidden">
            <div class="drop-message">拖放 PDF 文件到此处</div>
          </div>
        </div>

        <div id="page-nav">
          <button id="btn-prev-page" title="上一页">&#9664;</button>
          <input type="number" id="page-input" min="1" value="1" />
          <span>/</span>
          <span id="total-pages">0</span>
          <button id="btn-next-page" title="下一页">&#9654;</button>
          <span class="divider-h"></span>
          <button id="btn-zoom-out" title="缩小">−</button>
          <span id="zoom-level">100%</span>
          <button id="btn-zoom-in" title="放大">+</button>
        </div>
      </section>

      <aside id="sidebar-right">
        <div class="sidebar-header">目录大纲</div>
        <div id="outline-tree"></div>
        <div id="outline-empty" class="empty-hint">此文档没有书签</div>
      </aside>
    </div>
  </div>

  <input type="file" id="file-input" accept=".pdf" style="display:none" />
  <input type="file" id="image-input" accept="image/*" style="display:none" />

  <div id="toast" class="hidden"></div>
  <div id="sticky-modal" class="hidden">
    <textarea id="sticky-text" placeholder="输入笔记内容..."></textarea>
    <div class="sticky-modal-actions">
      <button id="sticky-save">保存</button>
      <button id="sticky-cancel">取消</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
